<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>7000單 · 教師後台</title>
<style>
:root{--bg:#0f1117;--surface:#1a1d27;--surface2:#232736;--accent:#6c63ff;--text:#e8eaf6;--text2:#9ea3c0;--know:#43d9ad;--warn:#f5a623;--border:#2e3150;}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text);padding:16px;line-height:1.45;}
.wrap{max-width:1100px;margin:0 auto;}
h1{font-size:1.35rem;margin-bottom:4px}
.sub{color:var(--text2);font-size:.85rem;margin-bottom:16px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:16px;}
.card input,.card select{background:var(--surface2);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:10px;margin:6px 8px 6px 0;font-size:.9rem;}
button{background:var(--accent);color:#fff;border:none;border-radius:8px;padding:10px 16px;font-weight:600;cursor:pointer;font-size:.88rem;}
button.secondary{background:var(--surface2);color:var(--text2);border:1px solid var(--border);}
button.warn{background:#3a2a10;color:var(--warn);border:1px solid var(--warn);}
.tabs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px;}
.tab{padding:8px 14px;border-radius:8px;border:1px solid var(--border);background:var(--surface2);color:var(--text2);cursor:pointer;font-size:.85rem;}
.tab.active{border-color:var(--accent);color:var(--accent);background:#1e1f3a;}
table{width:100%;border-collapse:collapse;font-size:.82rem;}
th,td{padding:9px 8px;border-bottom:1px solid var(--border);text-align:left;vertical-align:top;}
th{background:var(--surface2);color:var(--text2);}
tr{cursor:pointer}
tr:hover td{background:rgba(108,99,255,.08)}
tr.selected td{background:rgba(108,99,255,.15)}
.num{text-align:right;font-variant-numeric:tabular-nums}
.badge-off{color:var(--warn);font-size:.75rem}
.layout{display:grid;grid-template-columns:1fr;gap:16px}
@media(min-width:900px){.layout.has-detail{grid-template-columns:1fr 1fr;}}
.detail h3{font-size:1rem;margin-bottom:8px}
.event{ font-size:.78rem;border-bottom:1px solid var(--border);padding:8px 0;}
.event .t{color:var(--text2)}
.event .a{color:var(--accent);font-weight:600}
.folder-row{display:flex;justify-content:space-between;gap:8px;padding:6px 0;border-bottom:1px dashed var(--border);font-size:.8rem;}
.rename-box{margin-top:12px;padding-top:12px;border-top:1px solid var(--border);}
.rename-box input{width:100%;max-width:280px;}
code{font-size:.78rem;color:var(--know)}
.top-actions{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px;flex-wrap:wrap;}
.back-home{display:inline-flex;align-items:center;gap:6px;background:var(--surface2);border:1px solid var(--border);color:var(--text2);border-radius:10px;padding:9px 14px;font-size:.85rem;font-weight:600;text-decoration:none;}
.back-home:hover{color:var(--accent);border-color:var(--accent);}
.ach-block{margin-top:16px;padding-top:16px;border-top:1px solid var(--border);}
.ach-block h4{font-size:.95rem;margin-bottom:10px;}
.ach-summary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:100%;margin-bottom:12px;}
.ach-summary-2{margin-top:-4px;margin-bottom:12px;}
.ach-card{background:var(--surface2);border-radius:12px;padding:12px 8px;text-align:center;border:1px solid var(--border);}
.ach-card .ach-num{font-size:1.35rem;font-weight:800;color:#ffd700;}
.ach-card .ach-num.know{color:var(--know);}
.ach-card .ach-num.warn{color:var(--warn);}
.ach-card .ach-lbl{font-size:.68rem;color:var(--text2);margin-top:2px;}
.ach-lv-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:100%;margin-bottom:12px;}
.ach-lv-box{background:var(--surface2);border-radius:10px;padding:8px 6px;border:1px solid var(--border);min-width:0;}
.ach-lv-name{font-size:.75rem;font-weight:700;margin-bottom:3px;}
.ach-lv-stats{font-size:.62rem;color:var(--text2);line-height:1.35;margin-bottom:5px;}
.ach-lv-stats em{font-style:normal;color:var(--know);font-weight:700;}
.ach-lv-stats .nb{color:var(--warn);font-weight:600;}
.ach-lv-track{width:100%;background:var(--border);border-radius:99px;height:5px;overflow:hidden;}
.ach-lv-fill{height:100%;border-radius:99px;background:var(--know);}
.ach-panel{background:var(--surface2);border-radius:12px;padding:12px;border:1px solid var(--border);margin-bottom:12px;font-size:.8rem;}
.ach-mini-row{display:flex;justify-content:space-between;gap:8px;padding:6px 0;border-bottom:1px solid var(--border);}
.ach-mini-row:last-child{border-bottom:none;}
.ach-session-main{font-size:.88rem;font-weight:600;margin-bottom:4px;}
.ach-session-sub{font-size:.76rem;color:var(--text2);line-height:1.45;}
.ach-log-row{background:var(--surface2);border-radius:10px;padding:10px;border:1px solid var(--border);margin-bottom:6px;font-size:.78rem;}
.ach-log-row .t{color:var(--text2);font-size:.72rem;margin-bottom:3px;}
.ach-log-row .d{font-weight:600;}
.ach-log-row .s{color:var(--know);font-size:.72rem;margin-top:3px;}
.ach-stale{font-size:.78rem;color:var(--warn);padding:10px;background:#2a1a10;border-radius:8px;border:1px solid var(--warn);}
@media(max-width:520px){.ach-summary,.ach-lv-grid{grid-template-columns:repeat(2,1fr);}}
</style>
<script src="class-config.js"></script>
</head>
<body>
<div class="wrap">
  <div class="top-actions">
    <div>
      <h1>📊 教師後台 · 班級進度</h1>
      <p class="sub" style="margin-bottom:0">免費 Firebase 同步。帳號 <code>teacher3388</code>（密碼請勿分享給學生）。</p>
    </div>
    <a href="index.html" class="back-home">← 返回學生首頁</a>
  </div>

  <div class="card" id="loginBox">
    <p style="margin-bottom:8px;font-size:.9rem;">教師登入</p>
    <input id="loginUser" placeholder="帳號" autocomplete="username">
    <input id="loginPass" type="password" placeholder="密碼" autocomplete="current-password">
    <button type="button" onclick="doLogin()">登入</button>
  </div>

  <div id="dash" style="display:none">
    <div class="card">
      <div class="tabs" id="gradeTabs"></div>
      <div class="tabs" id="classTabs"></div>
      <p class="sub" id="metaLine" style="margin:0 0 10px"></p>
      <button type="button" class="secondary" onclick="loadRoster()">🔄 重新整理</button>
    </div>

    <div class="layout" id="mainLayout">
      <div class="card">
        <table>
          <thead>
            <tr>
              <th>座號</th>
              <th>顯示名稱</th>
              <th class="num">已掌握</th>
              <th class="num">錯題</th>
              <th>最後活動</th>
            </tr>
          </thead>
          <tbody id="rosterBody"></tbody>
        </table>
      </div>

      <div class="card detail" id="detailPanel" style="display:none">
        <h3 id="detailTitle">學生詳情</h3>
        <p class="sub" id="detailSub" style="margin-bottom:10px"></p>

        <div class="rename-box">
          <p style="font-size:.85rem;margin-bottom:6px">修改顯示名稱（不雅暱稱可在這裡覆蓋，不刪學生資料）</p>
          <input id="renameInput" placeholder="新顯示名稱">
          <button type="button" onclick="saveRename()">儲存名稱</button>
          <button type="button" class="secondary" onclick="clearRename()">恢復原暱稱</button>
        </div>

        <div class="ach-block">
          <h4>🏆 學習成就（與學生端相同）</h4>
          <div id="studentAchievement"></div>
        </div>

        <h4 style="margin:16px 0 8px;font-size:.9rem">📁 各資料夾練習次數</h4>
        <div id="folderStats"></div>

        <h4 style="margin:16px 0 8px;font-size:.9rem">🕐 活動紀錄（最近 80 筆）</h4>
        <div id="eventList"></div>
      </div>
    </div>
  </div>
</div>

<script>
var FB_URL = CLASS_CONFIG.FB_URL;
var activeGrade = 'g2';
var activeClass = 'zhong';
var rosterRows = [];
var selectedKey = null;
var selectedRow = null;

function doLogin() {
  var u = document.getElementById('loginUser').value.trim();
  var p = document.getElementById('loginPass').value;
  if (u === CLASS_CONFIG.TEACHER_USER && p === CLASS_CONFIG.TEACHER_PASS) {
    sessionStorage.setItem('teacher_auth', '1');
    document.getElementById('loginBox').style.display = 'none';
    document.getElementById('dash').style.display = 'block';
    buildTabs();
    loadRoster();
  } else {
    alert('帳號或密碼錯誤');
  }
}
if (sessionStorage.getItem('teacher_auth') === '1') {
  document.getElementById('loginBox').style.display = 'none';
  document.getElementById('dash').style.display = 'block';
}

function classKey() {
  return cfgBuildClassKey(activeGrade, activeClass);
}
function buildTabs() {
  var gt = document.getElementById('gradeTabs');
  gt.innerHTML = '';
  CLASS_CONFIG.GRADES.forEach(function (g) {
    var b = document.createElement('button');
    b.type = 'button';
    b.className = 'tab' + (g.id === activeGrade ? ' active' : '');
    b.textContent = g.label;
    b.onclick = function () {
      activeGrade = g.id;
      buildTabs();
      loadRoster();
    };
    gt.appendChild(b);
  });
  var ct = document.getElementById('classTabs');
  ct.innerHTML = '';
  CLASS_CONFIG.CLASSES.forEach(function (c) {
    var b = document.createElement('button');
    b.type = 'button';
    b.className = 'tab' + (c.id === activeClass ? ' active' : '');
    b.textContent = c.label;
    b.onclick = function () {
      activeClass = c.id;
      buildTabs();
      loadRoster();
    };
    ct.appendChild(b);
  });
}

function fbGet(path) {
  return fetch(FB_URL + '/' + path + '.json').then(function (r) {
    return r.json();
  });
}
function fbPut(path, data) {
  return fetch(FB_URL + '/' + path + '.json', {
    method: 'PUT',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(data),
  }).then(function (r) {
    return r.json();
  });
}

function displayName(pr) {
  if (!pr) return '—';
  if (pr.nameOverride && String(pr.nameOverride).trim()) return String(pr.nameOverride).trim();
  return pr.nickname || pr.displayName || '—';
}

function loadRoster() {
  selectedKey = null;
  selectedRow = null;
  document.getElementById('detailPanel').style.display = 'none';
  document.getElementById('mainLayout').classList.remove('has-detail');
  var label = cfgFormatClassLabel(activeGrade, activeClass, '');
  document.getElementById('metaLine').textContent = label + ' · 載入中…';
  fbGet('classrooms/' + classKey() + '/students')
    .then(function (data) {
      rosterRows = [];
      if (data && typeof data === 'object') {
        Object.keys(data).forEach(function (key) {
          var node = data[key] || {};
          var pr = node.profile || {};
          var pg = node.progress || {};
          rosterRows.push({
            key: key,
            profile: pr,
            progress: pg,
          });
        });
      }
      rosterRows.sort(function (a, b) {
        var sa = parseInt(a.profile.seat, 10);
        var sb = parseInt(b.profile.seat, 10);
        if (!isNaN(sa) && !isNaN(sb) && sa !== sb) return sa - sb;
        return (b.progress.updatedAt || 0) - (a.progress.updatedAt || 0);
      });
      renderRoster();
      document.getElementById('metaLine').textContent =
        label + ' · 已登入 ' + rosterRows.length + ' 人 · ' + new Date().toLocaleString('zh-TW');
    })
    .catch(function (e) {
      document.getElementById('metaLine').textContent = '讀取失敗：' + e;
    });
}

function renderRoster() {
  var tb = document.getElementById('rosterBody');
  tb.innerHTML = '';
  if (rosterRows.length === 0) {
    tb.innerHTML =
      '<tr><td colspan="5" style="color:var(--text2)">尚無學生（請學生先開 index.html 完成身分登記）</td></tr>';
    return;
  }
  rosterRows.forEach(function (row) {
    var pr = row.profile;
    var pg = row.progress || {};
    var tr = document.createElement('tr');
    if (row.key === selectedKey) tr.className = 'selected';
    var ts = pg.updatedAt || pr.lastSeen;
    var when = ts ? new Date(ts).toLocaleString('zh-TW') : '—';
    var nickHtml = escapeHtml(displayName(pr));
    if (pr.nameOverride) nickHtml += ' <span class="badge-off">已改名</span>';
    tr.innerHTML =
      '<td>' +
      escapeHtml(pr.seat || '—') +
      '</td><td>' +
      nickHtml +
      '</td><td class="num">' +
      (pg.masteredTotal || 0) +
      '</td><td class="num">' +
      (pg.nbTotal || 0) +
      '</td><td class="stale">' +
      when +
      '</td>';
    tr.onclick = function () {
      selectStudent(row);
    };
    tb.appendChild(tr);
  });
}

function selectStudent(row) {
  selectedKey = row.key;
  selectedRow = row;
  document.getElementById('detailPanel').style.display = 'block';
  document.getElementById('mainLayout').classList.add('has-detail');
  var pr = row.profile;
  document.getElementById('detailTitle').textContent =
    displayName(pr) + (pr.seat && pr.seat !== '00' ? '（#' + pr.seat + '）' : '');
  document.getElementById('detailSub').textContent =
    (pr.classLabel || '') + ' · 原暱稱：' + (pr.nickname || '—');
  document.getElementById('renameInput').value = pr.nameOverride || '';
  renderStudentAchievement(row.progress || {});
  renderRoster();
  loadStudentDetail(row);
}

function renderStudentAchievement(pg) {
  var el = document.getElementById('studentAchievement');
  if (!el) return;
  var ach = pg.achievement;
  var mastered = pg.masteredTotal || 0;
  var nb = pg.nbTotal || 0;
  if (!ach) {
    el.innerHTML =
      '<div class="ach-stale">此學生尚無完整成就資料（請學生重新開啟首頁並練習一下，約數秒後按「重新整理」）。</div>' +
      '<div class="ach-summary" style="margin-top:10px">' +
      '<div class="ach-card"><div class="ach-num">' +
      mastered +
      '</div><div class="ach-lbl">已掌握</div></div>' +
      '<div class="ach-card"><div class="ach-num warn">' +
      nb +
      '</div><div class="ach-lbl">錯題</div></div>' +
      '</div>';
    return;
  }
  var html =
    '<div class="ach-summary">' +
    '<div class="ach-card"><div class="ach-num">' +
    mastered +
    '</div><div class="ach-lbl">目前掌握字數</div></div>' +
    '<div class="ach-card"><div class="ach-num warn">' +
    nb +
    '</div><div class="ach-lbl">錯題待加強</div></div>' +
    '<div class="ach-card"><div class="ach-num know">+' +
    (ach.todayMastered || 0) +
    '</div><div class="ach-lbl">今日新掌握</div></div>' +
    '</div>' +
    '<div class="ach-summary ach-summary-2">' +
    '<div class="ach-card"><div class="ach-num know">' +
    (ach.weekMastered || 0) +
    '</div><div class="ach-lbl">本週新掌握</div></div>' +
    '<div class="ach-card"><div class="ach-num">' +
    (ach.batchTotal || 0) +
    '</div><div class="ach-lbl">累積待考字數</div></div>' +
    '<div class="ach-card"><div class="ach-num">' +
    (ach.streak || 0) +
    '</div><div class="ach-lbl">連續學習天數</div></div>' +
    '</div>';
  if (ach.levels && ach.levels.length) {
    html += '<p class="sub" style="margin:0 0 6px">📊 各級進度（掌握／剩餘／錯題）</p><div class="ach-lv-grid">';
    ach.levels.forEach(function (s) {
      var nbLine =
        s.nb > 0
          ? '<div class="ach-lv-stats"><span class="nb">錯題 ' + s.nb + '</span></div>'
          : '';
      html +=
        '<div class="ach-lv-box">' +
        '<div class="ach-lv-name">Level ' +
        s.lv +
        '</div>' +
        '<div class="ach-lv-stats"><em>' +
        s.mastered +
        '</em>/' +
        s.tot +
        ' 掌握 · 剩 ' +
        s.rem +
        '</div>' +
        nbLine +
        '<div class="ach-lv-track"><div class="ach-lv-fill" style="width:' +
        (s.pct || 0) +
        '%"></div></div></div>';
    });
    html += '</div>';
  }
  html += '<p class="sub" style="margin:0 0 6px">📤 待考字彙</p><div class="ach-panel">';
  if (!ach.batchDays || !ach.batchDays.length) {
    html += '<div class="ach-session-sub">尚無待考紀錄</div>';
  } else {
    html +=
      '<div class="ach-session-sub" style="margin-bottom:8px">共 <strong style="color:var(--know)">' +
      (ach.batchTotal || 0) +
      '</strong> 字</div>';
    ach.batchDays.forEach(function (b) {
      html +=
        '<div class="ach-mini-row"><span>' +
        escapeHtml(b.day) +
        '</span><span style="color:var(--know);font-weight:700">' +
        b.count +
        ' 字</span></div>';
    });
  }
  html += '</div>';
  html += '<p class="sub" style="margin:0 0 6px">🕐 最近一次練習</p><div class="ach-panel">';
  if (!ach.lastSession) {
    html += '<div class="ach-session-sub">還沒有練習紀錄</div>';
  } else {
    var last = ach.lastSession;
    var sub =
      last.total > 0
        ? '答對 ' +
          last.score +
          '／' +
          last.total +
          ' 字' +
          (last.pct ? '（約 ' + last.pct + '%）' : '')
        : '答對 ' + (last.score || 0) + ' 字';
    html +=
      '<div class="ach-session-main">' +
      escapeHtml(last.label) +
      ' · ' +
      escapeHtml(last.date) +
      ' ' +
      escapeHtml(last.time) +
      '</div>' +
      '<div class="ach-session-sub">' +
      escapeHtml(last.detail) +
      '</div>' +
      '<div class="ach-session-sub" style="margin-top:6px;color:var(--know)">' +
      escapeHtml(sub) +
      '</div>';
  }
  html += '</div>';
  if (ach.recentLogs && ach.recentLogs.length) {
    html += '<p class="sub" style="margin:0 0 6px">📅 學習日誌（最近 ' + ach.recentLogs.length + ' 筆）</p>';
    ach.recentLogs.forEach(function (e) {
      var typeMap = {
        scan: '快篩',
        review: '複習',
        drill: '錯題',
        folder: '資料夾',
      };
      html +=
        '<div class="ach-log-row"><div class="t">' +
        escapeHtml(e.date) +
        ' ' +
        escapeHtml(e.time) +
        ' · ' +
        escapeHtml(typeMap[e.type] || '其他') +
        '</div><div class="d">' +
        escapeHtml(e.detail) +
        '</div><div class="s">答對 ' +
        (e.score || 0) +
        ' 字</div></div>';
    });
  }
  el.innerHTML = html;
}

function loadStudentDetail(row) {
  var base = 'classrooms/' + classKey() + '/students/' + row.key;
  document.getElementById('folderStats').innerHTML = '<p class="sub">載入中…</p>';
  document.getElementById('eventList').innerHTML = '';
  Promise.all([fbGet(base + '/folderPractice'), fbGet(base + '/events')]).then(function (res) {
    var folderPractice = res[0] || {};
    var eventsRaw = res[1] || {};
    var fs = document.getElementById('folderStats');
    var fkeys = Object.keys(folderPractice);
    if (fkeys.length === 0) {
      fs.innerHTML = '<p class="sub">尚無資料夾練習紀錄</p>';
    } else {
      fs.innerHTML = '';
      fkeys
        .map(function (k) {
          return folderPractice[k];
        })
        .sort(function (a, b) {
          return (b.sessions || 0) - (a.sessions || 0);
        })
        .forEach(function (f) {
          var div = document.createElement('div');
          div.className = 'folder-row';
          div.innerHTML =
            '<span>📁 ' +
            escapeHtml(f.name || '資料夾') +
            '</span><span>' +
            (f.sessions || 0) +
            ' 次 · 答對 ' +
            (f.correct || 0) +
            '/' +
            (f.questions || 0) +
            '</span>';
          fs.appendChild(div);
        });
    }
    var events = Object.keys(eventsRaw)
      .map(function (k) {
        var e = eventsRaw[k];
        e._id = k;
        return e;
      })
      .sort(function (a, b) {
        return (b.ts || 0) - (a.ts || 0);
      })
      .slice(0, 80);
    var el = document.getElementById('eventList');
    if (events.length === 0) {
      el.innerHTML = '<p class="sub">尚無活動紀錄</p>';
      return;
    }
    el.innerHTML = '';
    events.forEach(function (e) {
      var div = document.createElement('div');
      div.className = 'event';
      var when = (e.date || '') + ' ' + (e.time || '');
      if (e.ts) when = new Date(e.ts).toLocaleString('zh-TW');
      div.innerHTML =
        '<div class="t">' +
        escapeHtml(when) +
        '</div><div class="a">' +
        escapeHtml(actionLabel(e.action)) +
        '</div><div>' +
        escapeHtml(e.detail || '') +
        '</div>';
      el.appendChild(div);
    });
  });
}

function actionLabel(a) {
  var map = {
    login: '登入',
    scan_start: '開始快篩',
    scan_end: '完成快篩',
    folder_start: '開始資料夾練習',
    folder_end: '完成資料夾練習',
    notebook_drill: '錯題本練習',
    review_test: '複習測驗',
  };
  return map[a] || a || '活動';
}

function saveRename() {
  if (!selectedRow) return;
  var name = document.getElementById('renameInput').value.trim();
  var base = 'classrooms/' + classKey() + '/students/' + selectedRow.key;
  fbGet(base).then(function (node) {
    node = node || {};
    node.profile = node.profile || {};
    node.profile.nameOverride = name;
    node.profile.displayName = name || node.profile.nickname;
    return fbPut(base, node);
  }).then(function () {
    alert('已更新顯示名稱');
    loadRoster();
    if (selectedRow) {
      selectedRow.profile.nameOverride = name;
      selectStudent(selectedRow);
    }
  });
}

function clearRename() {
  document.getElementById('renameInput').value = '';
  saveRename();
}

function escapeHtml(s) {
  return String(s || '')
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;');
}

if (sessionStorage.getItem('teacher_auth') === '1') {
  buildTabs();
  loadRoster();
}
</script>
</body>
